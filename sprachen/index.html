<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F9D8A" />
    <meta name="description" content="LinguaFlow – Sprachen lernen mit Puppy: kurze Lektionen, echte Dialoge, Übungen und Wiederholung." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LinguaFlow" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LinguaFlow</title>
    <style>
      #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ECFBF7;font-family:system-ui,sans-serif;color:#0B5F55;z-index:9999;transition:opacity .4s}
      #splash img{width:auto;height:150px}
      html.dunkel #splash{background:#0D1220;color:#9EF0DE}
    </style>
    <script>
      try { var t = localStorage.getItem('lernito-theme'); if (t === 'dunkel' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dunkel'); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/puppy/puppy.webp" alt="" /><p style="font-size:1.4rem;font-weight:800">LinguaFlow</p></div>
    <div id="root"></div>
    <noscript>Bitte aktiviere JavaScript, um LinguaFlow zu benutzen.</noscript>
    <script type="module" src="/src/sprachen/main.tsx"></script>
  </body>
</html>
