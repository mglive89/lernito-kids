<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7FB" />
    <meta name="description" content="Lernito Kids – spielerisch lernen mit Puppy. Für Kindergarten und Grundschule." />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <div id="splash" aria-hidden="true"><img src="/puppy/puppy.webp" alt="" /><p style="font-size:1.4rem;font-weight:800">Lernito Kids</p></div>
